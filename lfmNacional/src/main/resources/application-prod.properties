# ============================================
# LFM Nacional - Configuración de Producción
# ============================================
# Usar: java -jar app.jar --spring.profiles.active=prod
# O variable: SPRING_PROFILES_ACTIVE=prod

# ---- Base de datos ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lfm?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:lfm_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# En prod el schema lo crea/valida Flyway; Hibernate solo valida que las
# entidades coincidan con el schema. No usar "update" con Flyway activo.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ---- Flyway ----
# Aplica db/migration/*.sql en orden. Con baseline-on-migrate=true y
# baseline-version=1, si la BD ya existe sin tabla flyway_schema_history
# (schema creado por Hibernate ddl-auto=update), Flyway la "bastea" en la
# version 1: marca V1 como ya aplicado y NO reintenta crear las tablas,
# dejando que `validate` confirme que el schema coincide con las entidades.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:true}
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ---- Cache ----
spring.cache.type=simple

# ---- Servidor ----
server.port=${SERVER_PORT:8080}
# Detras de Caddy/Nginx confia en los headers X-Forwarded-* para generar
# redirects (realm de Steam) con https:// y el host publico.
server.forward-headers-strategy=framework

# ---- Sesiones Assetto Corsa ----
sesiones.input-dir=${SESIONES_DIR:/home/ubuntu/app/sesiones}
sesiones.procesadas-dir=${SESIONES_DIR:/home/ubuntu/app/sesiones}/procesadas
sesiones.errores-dir=${SESIONES_DIR:/home/ubuntu/app/sesiones}/errores

# ---- Archivos ----
archivos.base-dir=${ARCHIVOS_DIR:/home/ubuntu/app/archivos}

# ---- Frontend ----
frontend.resources-path=file:./files/
# Con HTTPS: FRONTEND_URL=https://<dominio> (usado por Steam realm/return-to)
frontend.url=${FRONTEND_URL}

# ---- Steam OpenID ----
steam.realm=${FRONTEND_URL}
steam.return-to=${FRONTEND_URL}/api/steam/vinculacion/callback
steam.return-to-auth=${FRONTEND_URL}/api/steam/auth/callback
steam.state-timeout-minutos=10

# ---- Uploads ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- JWT ----
jwt.secreto=${JWT_SECRETO}
jwt.expiracion-minutos=480

# ---- CORS ----
# Con HTTPS: CORS_ALLOWED_ORIGINS=https://<dominio>
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# ---- Actuator / Health ----
# Solo se expone /actuator/health (usan el HEALTHCHECK del contenedor y
# monitoreo externo). El health de la BD se valida automaticamente.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---- Logging ----
# Archivo con rotacion: 10MB por archivo, 7 archivos, max 100MB totales.
# Nunca se loguean secretos (password de BD / JWT).
logging.file.name=${LOG_DIR:/home/ubuntu/app/logs}/lfm.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.level.root=INFO
logging.level.org.hibernate=WARN
logging.level.org.apache.catalina=WARN
logging.level.com.zaxxer.hikari=WARN
# No exponer stack traces / mensajes internos al cliente.
server.error.include-stacktrace=never
server.error.include-message=never
