# ============================================
# LFM Nacional - Configuración de Producción
# ============================================
# Usar: java -jar app.jar --spring.profiles.active=prod
# O variable: SPRING_PROFILES_ACTIVE=prod

# ---- Base de datos ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lfm?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:lfm_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ---- Flyway (deshabilitado en prod por ahora) ----
# El schema se crea/aplica con Hibernate ddl-auto=${JPA_DDL_AUTO}. Flyway
# versionado queda como follow-up (requiere reinicializar la BD para aplicar V1/V2).
spring.flyway.enabled=false

# ---- Cache ----
spring.cache.type=simple

# ---- Servidor ----
server.port=${SERVER_PORT:8080}

# ---- Sesiones Assetto Corsa ----
sesiones.input-dir=${SESIONES_DIR:/home/ubuntu/app/sesiones}
sesiones.procesadas-dir=${SESIONES_DIR:/home/ubuntu/app/sesiones}/procesadas
sesiones.errores-dir=${SESIONES_DIR:/home/ubuntu/app/sesiones}/errores

# ---- Archivos ----
archivos.base-dir=${ARCHIVOS_DIR:/home/ubuntu/app/archivos}

# ---- Frontend ----
frontend.resources-path=file:./files/
frontend.url=${FRONTEND_URL}

# ---- Steam OpenID ----
# STEAM_REALM / STEAM_RETURN_TO / STEAM_RETURN_TO_AUTH apuntan a la API (Render),
# NO al frontend (Vercel). Si no se setean, se usa FRONTEND_URL como fallback (dev/local).
steam.realm=${STEAM_REALM:${FRONTEND_URL}}
steam.return-to=${STEAM_RETURN_TO:${FRONTEND_URL}/api/steam/vinculacion/callback}
steam.return-to-auth=${STEAM_RETURN_TO_AUTH:${FRONTEND_URL}/api/steam/auth/callback}
steam.state-timeout-minutos=10

# ---- Uploads ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- JWT ----
jwt.secreto=${JWT_SECRETO}
jwt.expiracion-minutos=480

# ---- CORS ----
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# ---- Mail (recuperacion de contrasena) ----
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.recovery.from=${MAIL_FROM:no-reply@lowfuel.local}
app.recovery.expira-minutos=30
