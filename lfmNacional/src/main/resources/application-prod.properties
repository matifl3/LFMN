# ============================================
# LFM Nacional - Configuración de Producción
# ============================================
# Usar: java -jar app.jar --spring.profiles.active=prod
# O variable: SPRING_PROFILES_ACTIVE=prod

# ---- Base de datos ----
spring.datasource.url=jdbc:mysql://localhost:3306/lfm?serverTimezone=UTC&useSSL=false&allowPublicKeyReRetrieveval=true
spring.datasource.username=${DB_USERNAME:lfm_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---- Cache ----
spring.cache.type=simple

# ---- Servidor ----
server.port=${SERVER_PORT:8080}

# ---- Sesiones Assetto Corsa ----
sesiones.input-dir=${SESIONES_DIR:/home/ubuntu/app/sesiones}
sesiones.procesadas-dir=${SESIONES_DIR:/home/ubuntu/app/sesiones}/procesadas
sesiones.errores-dir=${SESIONES_DIR:/home/ubuntu/app/sesiones}/errores

# ---- Archivos ----
archivos.base-dir=${ARCHIVOS_DIR:/home/ubuntu/app/archivos}

# ---- Frontend ----
frontend.resources-path=file:./files/
frontend.url=${FRONTEND_URL}

# ---- Steam OpenID ----
steam.realm=${FRONTEND_URL}
steam.return-to=${FRONTEND_URL}/api/steam/vinculacion/callback
steam.return-to-auth=${FRONTEND_URL}/api/steam/auth/callback
steam.state-timeout-minutos=10

# ---- Uploads ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- JWT ----
jwt.secreto=${JWT_SECRETO}
jwt.expiracion-minutos=480

# ---- CORS ----
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}
