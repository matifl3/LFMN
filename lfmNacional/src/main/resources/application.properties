spring.application.name=lfmNacional

spring.datasource.url=jdbc:mysql://localhost:3306/lfm?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
# Sin default: la password de BD no va al repo. Localmente exportar DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.cache.type=simple
# Dev: Flyway deshabilitado, Hibernate crea/actualiza el schema.
# Si cambias entidades, genera una migracion V2__***.sql en db/migration
# para que prod (Flyway validate) mantenga el schema consistente.
spring.flyway.enabled=false

server.port=8080

sesiones.input-dir=${SESIONES_DIR:./sesiones}
sesiones.procesadas-dir=${SESIONES_DIR:./sesiones}/procesadas
sesiones.errores-dir=${SESIONES_DIR:./sesiones}/errores

archivos.base-dir=./archivos

frontend.resources-path=file:../files/

steam.realm=${FRONTEND_URL:http://localhost:4200}
steam.return-to=${FRONTEND_URL:http://localhost:4200}/api/steam/vinculacion/callback
steam.return-to-auth=${FRONTEND_URL:http://localhost:4200}/api/steam/auth/callback
frontend.url=${FRONTEND_URL:http://localhost:4200}
steam.state-timeout-minutos=10

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secreto=${JWT_SECRETO:dev-secret-not-for-production-32chars!}
jwt.expiracion-minutos=480

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:4200}

# ---- Mail (recuperacion de contrasena) ----
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.recovery.from=${MAIL_FROM:no-reply@lowfuel.local}
app.recovery.expira-minutos=30
