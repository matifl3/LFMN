spring.datasource.url=jdbc:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.cache.type=simple
spring.flyway.enabled=false

jwt.secreto=test-secret-test-secret-test-secret-0123456789
jwt.expiracion-minutos=480

cors.allowed-origins=http://localhost:8080

steam.realm=http://localhost:8080
steam.return-to=http://localhost:8080/api/steam/vinculacion/callback
steam.return-to-auth=http://localhost:8080/api/steam/auth/callback
frontend.url=http://localhost:8080
steam.state-timeout-minutos=10

sesiones.input-dir=/tmp/sesiones-test
sesiones.procesadas-dir=/tmp/sesiones-test/procesadas
sesiones.errores-dir=/tmp/sesiones-test/errores

archivos.base-dir=/tmp/archivos-test

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
