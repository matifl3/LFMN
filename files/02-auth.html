<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — LFM Nacional</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<header class="site-header">
  <div class="container-wide">
    <a href="01-home.html" class="brand">
      <span class="brand-mark">L</span>
      <span class="brand-name">LFM Nacional<small>Low Fuel Motorsport</small></span>
    </a>
    <div class="header-actions">
      <span class="text-tertiary" style="font-size:var(--fs-sm)">¿No tenés cuenta? </span>
      <a href="02-auth.html#register" class="btn btn-ghost btn-sm">Crear cuenta</a>
    </div>
  </div>
</header>

<div class="auth-shell pattern-trackgrid">
  <div class="auth-card card bracket bracket-celeste">
    <div class="text-center" style="margin-bottom:var(--sp-6)">
      <span class="brand-mark" style="width:44px;height:44px;font-size:var(--fs-lg);margin-inline:auto">L</span>
      <h2 style="margin-top:var(--sp-4)">Ingresar a LFM</h2>
      <p class="text-tertiary" style="font-size:var(--fs-sm); margin-top:var(--sp-2)">Accedé con tu cuenta de piloto para inscribirte a carreras y ver tus estadísticas.</p>
    </div>

    <div class="tabs-pill" style="width:100%; margin-bottom:var(--sp-6)">
      <button type="button" class="tab active" id="tab-login" style="flex:1; justify-content:center; background:none; border:none; cursor:pointer; font:inherit; color:inherit">Iniciar sesión</button>
      <button type="button" class="tab" id="tab-register" style="flex:1; justify-content:center; background:none; border:none; cursor:pointer; font:inherit; color:inherit">Crear cuenta</button>
    </div>

    <form id="form-login">
      <div class="field">
        <label for="login-email">Email</label>
        <input class="input" type="email" id="login-email" placeholder="piloto@ejemplo.com" required>
      </div>
      <div class="field">
        <label for="login-pass">Contraseña</label>
        <input class="input" type="password" id="login-pass" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login">Ingresar</button>
    </form>

    <form id="form-register" style="display:none">
      <div class="field">
        <label for="reg-nombre">Nombre de piloto</label>
        <input class="input" type="text" id="reg-nombre" placeholder="Ej. Franco Gómez Reta">
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input class="input" type="email" id="reg-email" placeholder="piloto@ejemplo.com" required>
      </div>
      <div class="field">
        <label for="reg-pass">Contraseña</label>
        <input class="input" type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-register">Crear cuenta</button>
    </form>

    <div class="divider-or">o continuar con</div>

    <button type="button" class="btn btn-ghost btn-block" id="btn-steam">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.89 1.57 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.73 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.42.2 2.47.1 2.73.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.8-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.26 10.26 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/></svg>
      Steam
    </button>

    <p class="text-tertiary text-center" style="font-size:var(--fs-2xs); margin-top:var(--sp-6)">Al continuar aceptás el Reglamento Deportivo y el Código de Conducta de LFM Nacional.</p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>


</body>
</html>
