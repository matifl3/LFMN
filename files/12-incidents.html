<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incidentes — LFM Nacional</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<header class="site-header">
  <div class="container-wide">
    <a href="01-home.html" class="brand">
      <span class="brand-mark">L</span>
      <span class="brand-name">LFM Nacional<small>Low Fuel Motorsport</small></span>
    </a>
    <nav class="main-nav">
      <a href="01-home.html">Inicio</a>
      <a href="03-races-list.html">Carreras</a>
      <a href="05-championship.html">Campeonato</a>
      <a href="06-categories.html">Categorías</a>
      <a href="07-setups.html">Setups</a>
      <a href="11-achievements.html">Logros</a>
    </nav>
    <div class="header-actions">
      <a href="10-notifications.html" class="icon-btn" aria-label="Notificaciones">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="dot"></span>
      </a>
      <a href="09-my-profile.html" aria-label="Mi perfil"><img class="avatar" width="38" height="38" src="https://i.pravatar.cc/80?img=12" alt=""></a>
    </div>
  </div>
</header>

<main class="container-wide section">
  <div class="section-head">
    <div>
      <span class="eyebrow">JUSTICIA DEPORTIVA</span>
      <h2>Incidentes y sanciones</h2>
    </div>
  </div>

  <div class="tabs" style="margin-bottom:var(--sp-6)">
    <button type="button" class="tab active" id="tab-incidentes" style="background:none;border:none;cursor:pointer;font:inherit;color:inherit">Incidentes <span class="count">0</span></button>
    <button type="button" class="tab" id="tab-sanciones" style="background:none;border:none;cursor:pointer;font:inherit;color:inherit">Sanciones <span class="count">0</span></button>
    <button type="button" class="tab" id="tab-apelaciones" style="background:none;border:none;cursor:pointer;font:inherit;color:inherit">Apelaciones <span class="count">0</span></button>
  </div>

  <div class="admin-layout">

    <div class="flex-col gap-3" id="inc-list">
      <p class="text-tertiary">Cargando…</p>
    </div>

    <aside class="panel-aside report-form-panel">
      <h4 style="margin-bottom:var(--sp-4)">Reportar un incidente</h4>
      <div class="field">
        <label for="inc-carrera">Carrera</label>
        <select class="select" id="inc-carrera"><option value="">Cargando…</option></select>
      </div>
      <div class="field">
        <label for="inc-vuelta">Vuelta del incidente</label>
        <input class="input" id="inc-vuelta" type="number" min="1" placeholder="Ej. 6">
      </div>
      <div class="field">
        <label for="inc-desc">Descripción</label>
        <textarea class="textarea" id="inc-desc" placeholder="Describí qué pasó, en qué curva y qué consecuencia tuvo…"></textarea>
      </div>
      <div class="field">
        <label for="inc-video">Evidencia (URL de video o imagen)</label>
        <input class="input" id="inc-video" type="url" placeholder="https://…">
      </div>
      <button type="button" class="btn btn-primary btn-block" id="inc-enviar">Enviar reporte</button>
    </aside>

  </div>
</main>

<footer class="site-footer">
  <div class="container-wide footer-grid">
    <div class="brand">
      <span class="brand-mark">L</span>
      <span class="brand-name">LFM Nacional<small>Low Fuel Motorsport</small></span>
    </div>
    <span class="text-tertiary" style="font-size:var(--fs-sm)">© 2026 LFM Nacional — Liga argentina de sim racing.</span>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/incidents.js"></script>
</body>
</html>
