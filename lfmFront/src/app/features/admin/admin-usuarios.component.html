<mat-card>
  <mat-card-header>
    <mat-card-title>Usuarios</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (cargando()) {
      <div class="centered">
        <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner>
      </div>
    } @else {
      <div class="table-wrap">
        <table mat-table [dataSource]="usuarios()">
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Piloto</th>
            <td mat-cell *matCellDef="let u">
              <a [routerLink]="['/pilotos', u.id]">{{ u.nombrePiloto ?? u.email }}</a>
            </td>
          </ng-container>
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let u">{{ u.email }}</td>
          </ng-container>
          <ng-container matColumnDef="elo">
            <th mat-header-cell *matHeaderCellDef>Elo</th>
            <td mat-cell *matCellDef="let u">{{ u.elo ?? 0 }}</td>
          </ng-container>
          <ng-container matColumnDef="sr">
            <th mat-header-cell *matHeaderCellDef>SR</th>
            <td mat-cell *matCellDef="let u">{{ u.safetyRating ?? 0 }}</td>
          </ng-container>
          <ng-container matColumnDef="rol">
            <th mat-header-cell *matHeaderCellDef>Rol</th>
            <td mat-cell *matCellDef="let u">
              <mat-select
                [value]="u.rol"
                (selectionChange)="cambiarRol(u, $event.value)"
                class="rol-select"
              >
                @for (rol of roles; track rol) {
                  <mat-option [value]="rol">{{ rol }}</mat-option>
                }
              </mat-select>
            </td>
          </ng-container>
          <ng-container matColumnDef="registro">
            <th mat-header-cell *matHeaderCellDef>Registro</th>
            <td mat-cell *matCellDef="let u">{{ u.fechaRegistro | date: 'dd/MM/yyyy' }}</td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let u">
              <button mat-icon-button color="warn" (click)="eliminar(u)" aria-label="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columnas"></tr>
          <tr mat-row *matRowDef="let row; columns: columnas"></tr>
        </table>
      </div>
    }
  </mat-card-content>
</mat-card>
