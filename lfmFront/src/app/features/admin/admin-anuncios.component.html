<mat-card>
  <mat-card-header>
    <mat-card-title>Anuncios</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="publicar()" class="form">
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Titulo</mat-label>
          <input matInput formControlName="titulo" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>URL de imagen (opcional)</mat-label>
          <input matInput formControlName="urlImagen" />
        </mat-form-field>
      </div>
      <mat-form-field appearance="outline">
        <mat-label>Contenido</mat-label>
        <textarea matInput formControlName="contenido" rows="3"></textarea>
      </mat-form-field>
      <div class="acciones-form">
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || guardando()">
          Publicar anuncio
        </button>
      </div>
    </form>

    @if (cargando()) {
      <div class="centered">
        <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner>
      </div>
    } @else {
      @for (anuncio of anuncios(); track anuncio.id) {
        <mat-card class="anuncio-card">
          <mat-card-header>
            <mat-card-title>{{ anuncio.titulo }}</mat-card-title>
            <mat-card-subtitle>{{ anuncio.fecha | date: 'dd/MM/yyyy HH:mm' }}</mat-card-subtitle>
          </mat-card-header>
          @if (anuncio.urlImagen) {
            <img mat-card-image [src]="anuncio.urlImagen" alt="Imagen del anuncio" />
          }
          <mat-card-content>
            <p>{{ anuncio.contenido }}</p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-button color="warn" (click)="eliminar(anuncio)">
              <mat-icon>delete</mat-icon>
              Eliminar
            </button>
          </mat-card-actions>
        </mat-card>
      } @empty {
        <p class="empty">No hay anuncios publicados.</p>
      }
    }
  </mat-card-content>
</mat-card>
