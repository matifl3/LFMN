<mat-card>
  <mat-card-header>
    <mat-card-title>Archivos</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="subir()" class="form">
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombre" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Tipo</mat-label>
          <mat-select formControlName="tipo">
            @for (tipo of tipos; track tipo) {
              <mat-option [value]="tipo">{{ tipo }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="form-row">
        <input type="file" (change)="onArchivoSeleccionado($event)" />
      </div>
      <div class="acciones-form">
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || !archivoSeleccionado() || subiendo()">
          Subir archivo
        </button>
      </div>
    </form>

    @if (cargando()) {
      <div class="centered">
        <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner>
      </div>
    } @else {
      <div class="table-wrap">
        <table mat-table [dataSource]="archivos()">
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let a">{{ a.nombre }}</td>
          </ng-container>
          <ng-container matColumnDef="tipo">
            <th mat-header-cell *matHeaderCellDef>Tipo</th>
            <td mat-cell *matCellDef="let a">{{ a.tipo }}</td>
          </ng-container>
          <ng-container matColumnDef="descarga">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let a">
              <a mat-button [href]="urlDescarga(a)">
                <mat-icon>download</mat-icon>
                Descargar
              </a>
            </td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let a">
              <button mat-icon-button color="warn" (click)="eliminar(a)" aria-label="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columnas"></tr>
          <tr mat-row *matRowDef="let row; columns: columnas"></tr>
        </table>
        @if (archivos().length === 0) {
          <p class="empty">No hay archivos cargados.</p>
        }
      </div>
    }
  </mat-card-content>
</mat-card>
