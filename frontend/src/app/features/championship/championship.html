<section class="container-wide section">
  <div class="section-head">
    <div><span class="eyebrow">Temporada 2026</span><h2>Campeonato</h2></div>
  </div>

  <div class="champ-select-bar" style="display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-6)">
    <select class="select" [value]="selectedId()" (change)="onChange($event)" style="min-width:220px">
      @if (cargando()) {
        <option>Cargando campeonatos…</option>
      } @else if (champs().length === 0) {
        <option>Sin campeonatos</option>
      } @else {
        @for (c of champs(); track c.id) {
          <option [value]="c.id">{{ c.nombre }}{{ c.temporada ? ' (' + c.temporada + ')' : '' }}</option>
        }
      }
    </select>
    <div class="tabs-pill"><span class="tab active">Pilotos</span></div>
    <span class="text-terciario mono" style="margin-left:auto">{{ champInfo() }}</span>
  </div>

  @if (tablaLoading()) {
    <div class="skeleton-card" style="padding:var(--sp-5)"><span class="skeleton" style="width:80%"></span><span class="skeleton" style="width:60%"></span></div>
  } @else if (tablaMsg()) {
    <p class="text-terciario">{{ tablaMsg() }}</p>
  } @else {
    <div class="table-wrap"><table class="table"><thead><tr><th>Pos</th><th>Piloto</th><th class="num">Puntos</th></tr></thead><tbody>
      @for (t of tabla(); track t.usuarioId; let i = $index) {
        <tr [class]="'podium-'+t.posicion">
          <td><app-rank-badge [posicion]="t.posicion || i+1"/></td>
          <td><a [routerLink]="['/perfil', t.usuarioId]" class="detail-link">{{ t.nombrePiloto }}</a></td>
          <td class="num mono glow-alerta" style="font-weight:700">{{ t.puntos }}</td>
        </tr>
      }
    </tbody></table></div>
  }
</section>
